[project]
name = "fusion-finance"
version = "0.5.1"
description = "Fusion-Finance — Local AI-powered financial analysis platform. macOS Apple Silicon native, 100% offline, powered by fusion-mlx."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "httpx>=0.27.0"]
export = ["weasyprint>=60.0", "python-pptx>=0.6.0", "openpyxl>=3.1.0"]

[project.scripts]
fusion-finance = "fusion_finance.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["fusion_finance/report/templates/*"]

[tool.coverage.report]
exclude_also = ["if __name__"]

[tool.setuptools.packages.find]
include = ["fusion_finance*"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["fusion_finance", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B904", "B905", "B008", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["fusion_finance"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
