{% extends "base.html" %}
{% block content %}
<h1 class="page-title">Risk &amp; Compliance</h1>

<section class="grid grid-2">
    <div class="card">
        <div class="card-head"><h2>Monte Carlo VaR</h2></div>
        <form id="var-form" class="form">
            <div class="grid grid-2 gap-2">
                <label class="field"><span>Portfolio value</span><input class="input" name="portfolio_value" type="number" step="any" value="1000000"></label>
                <label class="field"><span>Simulations</span><input class="input" name="simulations" type="number" min="1" value="10000"></label>
                <label class="field"><span>Drift (mu, daily)</span><input class="input" name="mu" type="number" step="0.0001" value="0.0002"></label>
                <label class="field"><span>Volatility (sigma, daily)</span><input class="input" name="sigma" type="number" step="0.0001" value="0.01"></label>
                <label class="field"><span>Horizon (days)</span><input class="input" name="days" type="number" min="1" value="10"></label>
            </div>
            <button class="btn btn-primary" type="submit">Compute VaR</button>
        </form>
    </div>
    <div class="card">
        <div class="card-head"><h2>Sanctions Screening</h2></div>
        <form id="sanctions-form" class="form">
            <label class="field"><span>Entity name</span><input class="input" name="entity" value="Acme Trading Co" required></label>
            <label class="field"><span>Match threshold (0–1)</span><input class="input" name="threshold" type="number" step="0.05" min="0" max="1" value="0.6"></label>
            <button class="btn btn-primary" type="submit">Screen</button>
        </form>
    </div>
</section>

<section class="card">
    <div class="card-head">
        <h2>Preset Stress Scenarios</h2>
        <button id="stress-btn" class="btn btn-sm">Load</button>
    </div>
    <div class="table-wrap" id="stress-wrap"><p class="muted">click Load to fetch presets</p></div>
</section>

<section class="card hidden" id="result-card">
    <div class="card-head"><h2 id="result-title">Result</h2></div>
    <div id="result-body" class="table-wrap"></div>
</section>
{% endblock %}
