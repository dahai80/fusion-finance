name: CI

on:
  push:
    branches: [main, "port-standardization"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dahai80/fusion-core
          path: fusion-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-paths: |
            pyproject.toml
            fusion-core/pyproject.toml
      - run: pip install -e ./fusion-core
      - run: pip install -e ".[test]"
      - run: pytest tests/ -v --tb=short --cov=fusion_finance --cov-fail-under=70
